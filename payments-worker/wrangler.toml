name = "isaiasdiaz-books-payments"
main = "src/index.js"
compatibility_date = "2026-10-10"

# Set these after creating resources in Cloudflare:
# [[r2_buckets]]
# binding = "BOOKS"
# bucket_name = "isaiasdiaz-books-private"
#
# [[kv_namespaces]]
# binding = "DOWNLOADS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
#
# [vars]
# PAYPAL_ENV = "sandbox"
# ALLOWED_ORIGIN = "https://isaiasdiaz.com"
# PAYPAL_CLIENT_ID = "PUBLIC_SANDBOX_CLIENT_ID"
#
# Store PAYPAL_CLIENT_SECRET with: npx wrangler secret put PAYPAL_CLIENT_SECRET
