name = "isaiasdiaz-contact-api"
main = "contact-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Configure these in Cloudflare Worker settings before using the form:
# 1. Secret TURNSTILE_SECRET_KEY (Turnstile secret)
# 2. Send Email binding CONTACT_EMAIL with verified destination isaiasdiaz@yahoo.com
# 3. Deploy and copy your workers.dev URL to Pages variable NEXT_PUBLIC_CONTACT_API_URL
# 4. Add NEXT_PUBLIC_TURNSTILE_SITE_KEY to Pages build variables
